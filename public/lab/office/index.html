<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#c4708f">
<title>🏢 משרד · תיקי תיעוד | כפיר</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --rose:#c4708f;--rose-dark:#a04e6b;--rose-light:#fde6ee;
  --cream:#fef3e8;--cream-deep:#fdf2f8;
  --gold:#d4a574;--green:#7cb342;--pink:#e94c5c;
  --ink:#3d2433;--gray:#64748b;
  --shadow:0 4px 20px rgba(196,112,143,.10);
  --shadow-lg:0 10px 40px rgba(196,112,143,.18);
}
body{font-family:'Heebo',sans-serif;background:linear-gradient(135deg,#fdf2f8 0%,#fef3e8 100%);color:var(--ink);min-height:100vh}
.lab-notice{background:rgba(245,158,11,.1);padding:8px 16px;text-align:center;font-size:11px;color:#92400e;font-weight:500}

/* LOGIN GATE */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate-card{background:white;border-radius:24px;padding:40px 32px;max-width:380px;width:100%;text-align:center;box-shadow:var(--shadow-lg)}
.gate-icon{font-size:64px;margin-bottom:16px}
.gate-title{font-size:24px;font-weight:800;color:var(--rose-dark);margin-bottom:6px}
.gate-sub{font-size:14px;color:var(--gray);margin-bottom:28px;line-height:1.5}
.gate-input{width:100%;padding:14px 16px;font-family:inherit;font-size:16px;border:2px solid rgba(196,112,143,.18);border-radius:14px;background:white;color:var(--ink);text-align:center;letter-spacing:.1em;margin-bottom:16px}
.gate-input:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 4px rgba(196,112,143,.1)}
.gate-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--rose),var(--rose-dark));color:white;border:none;border-radius:14px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(196,112,143,.35)}
.gate-btn:active{transform:scale(.97)}
.gate-err{color:var(--pink);font-size:13px;margin-top:12px;display:none}

/* DASHBOARD */
.header{background:linear-gradient(135deg,var(--rose),var(--rose-dark));color:white;padding:24px 20px 40px;border-radius:0 0 28px 28px}
.header-inner{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px}
.header-title{font-size:24px;font-weight:800}
.header-sub{font-size:13px;opacity:.9;margin-top:4px}
.logout{background:rgba(255,255,255,.18);color:white;border:none;padding:8px 14px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer}

.container{max-width:1100px;margin:0 auto;padding:0 16px}

.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:-24px 0 24px;position:relative;z-index:2}
@media(max-width:640px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:white;border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.stat-num{font-size:32px;font-weight:800;color:var(--rose-dark);line-height:1}
.stat-label{font-size:12px;color:var(--gray);margin-top:6px;font-weight:500}

.tools{background:white;border-radius:18px;padding:16px;margin-bottom:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.search-input{flex:1;min-width:200px;padding:11px 16px;font-family:inherit;font-size:15px;border:2px solid rgba(196,112,143,.18);border-radius:12px;background:#fafafa}
.search-input:focus{outline:none;border-color:var(--rose);background:white}
.filter-chip{padding:8px 14px;border:2px solid rgba(196,112,143,.2);border-radius:12px;background:white;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer}
.filter-chip.active{background:var(--rose);color:white;border-color:var(--rose-dark)}

.reports-list{display:flex;flex-direction:column;gap:10px;padding-bottom:40px}
.report-card{background:white;border-radius:16px;padding:18px;box-shadow:var(--shadow);cursor:pointer;border:1px solid transparent;transition:all .2s}
.report-card:hover{border-color:var(--rose);transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.report-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.report-child{font-size:18px;font-weight:700;color:var(--ink)}
.report-date{font-size:12px;color:var(--gray)}
.report-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.meta-pill{font-size:11px;background:var(--rose-light);color:var(--rose-dark);padding:3px 10px;border-radius:10px;font-weight:500}
.meta-pill.danger{background:#fee2e2;color:#991b1b}
.meta-pill.gold{background:#fef3c7;color:#92400e}
.report-types{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.type-tag{font-size:11px;padding:3px 8px;border-radius:8px;background:#f1f5f9;color:#475569;font-weight:500}
.report-desc{font-size:13px;color:var(--gray);line-height:1.5;margin-top:8px;padding-top:8px;border-top:1px solid rgba(196,112,143,.1)}

.empty{background:white;border-radius:18px;padding:60px 20px;text-align:center;box-shadow:var(--shadow);border:2px dashed rgba(196,112,143,.25)}
.empty-icon{font-size:64px;margin-bottom:12px;opacity:.5}
.empty-text{color:var(--gray);font-size:15px;line-height:1.6}

.loading{text-align:center;padding:40px;color:var(--gray)}

/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal-bg.show{display:flex}
.modal{background:white;border-radius:20px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;padding:24px;box-shadow:var(--shadow-lg)}
.modal-close{float:left;background:var(--rose-light);border:none;color:var(--rose-dark);width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer}
.modal h2{font-size:22px;color:var(--rose-dark);margin-bottom:18px;padding-left:40px}
.modal-section{margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid rgba(196,112,143,.1)}
.modal-section:last-child{border:none}
.modal-section-title{font-size:11px;font-weight:700;color:var(--rose);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.modal-row{display:flex;justify-content:space-between;padding:5px 0;gap:12px;font-size:14px}
.modal-label{color:var(--gray);font-weight:500}
.modal-value{color:var(--ink);font-weight:600;text-align:left}
.modal-desc{background:var(--cream-deep);padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.6;margin-top:6px}
</style>
</head>
<body>

<!-- LOGIN GATE -->
<div id="gate" class="gate">
  <div class="gate-card">
    <div class="gate-icon">🔐</div>
    <div class="gate-title">משרד כפיר</div>
    <div class="gate-sub">צפייה בתיקי תיעוד מקצועיים<br>גישה מורשית בלבד</div>
    <input id="gate-key" class="gate-input" type="password" placeholder="קוד גישה" autofocus onkeydown="if(event.key==='Enter')checkKey()">
    <button class="gate-btn" onclick="checkKey()">כניסה</button>
    <div id="gate-err" class="gate-err">קוד שגוי</div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none">
  <div class="lab-notice">🧪 גרסת ניסוי · משרד כפיר · גישה מורשית</div>

  <header class="header">
    <div class="header-inner">
      <div>
        <div class="header-title">📁 תיקי תיעוד</div>
        <div class="header-sub">משרד כפיר · ניהול דיווחי שטח</div>
      </div>
      <button class="logout" onclick="logout()">יציאה</button>
    </div>
  </header>

  <div class="container">
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-num" id="s-total">0</div><div class="stat-label">סה"כ דיווחים</div></div>
      <div class="stat-card"><div class="stat-num" id="s-today">0</div><div class="stat-label">היום</div></div>
      <div class="stat-card"><div class="stat-num" id="s-week">0</div><div class="stat-label">השבוע</div></div>
      <div class="stat-card"><div class="stat-num" id="s-children">0</div><div class="stat-label">ילדים מתועדים</div></div>
    </div>

    <!-- 💡 תובנות חכמות -->
    <div id="insights-section" style="background:white;border-radius:18px;padding:18px;margin-bottom:18px;box-shadow:var(--shadow);border:2px solid rgba(212,165,116,.25);background:linear-gradient(135deg,#fff,#fef3e8);display:none">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
        <div style="font-size:22px">💡</div>
        <div style="font-weight:800;color:var(--rose-dark);font-size:16px">תובנות חכמות מהמאגר</div>
      </div>
      <div id="insights-content"></div>
    </div>

    <div class="tools">
      <input id="search" class="search-input" type="text" placeholder="🔍 חיפוש לפי שם ילד / הורה / מנהלת..." oninput="render()">
      <button class="filter-chip active" data-filter="all" onclick="setFilter('all')">הכל</button>
      <button class="filter-chip" data-filter="today" onclick="setFilter('today')">היום</button>
      <button class="filter-chip" data-filter="week" onclick="setFilter('week')">השבוע</button>
      <button class="filter-chip" data-filter="violence" onclick="setFilter('violence')">אלימות</button>
    </div>

    <div id="reports-list" class="reports-list">
      <div class="loading">⏳ טוען דיווחים...</div>
    </div>
  </div>
</div>

<!-- Modal -->
<div id="modal-bg" class="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-content"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCXs7a644_tl_Mu-A-Jnq5mXBXVp-OILKY",
  authDomain: "kfir-site-f3ab5.firebaseapp.com",
  projectId: "kfir-site-f3ab5",
  storageBucket: "kfir-site-f3ab5.firebasestorage.app",
  messagingSenderId: "116106158672",
  appId: "1:116106158672:web:3db78243185fbdc81ce755"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
window._db = db; window._getDocs = getDocs; window._collection = collection; window._query = query; window._orderBy = orderBy;
</script>

<script>
// 🔐 Gate - סיסמה פשוטה ל-MVP (יוחלף ב-Firebase Auth)
const ACCESS_KEY = 'kfir2026';

function checkKey() {
  const k = document.getElementById('gate-key').value;
  if (k === ACCESS_KEY) {
    localStorage.setItem('office_key', k);
    document.getElementById('gate').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadReports();
  } else {
    document.getElementById('gate-err').style.display = 'block';
  }
}
function logout() {
  localStorage.removeItem('office_key');
  location.reload();
}
window.checkKey = checkKey;
window.logout = logout;

if (localStorage.getItem('office_key') === ACCESS_KEY) {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
}

let allReports = [];
let currentFilter = 'all';

// 🔄 נורמליזציה - תואם לסכמות ישנות וחדשות
function normalizeReport(r) {
  const splitName = (str) => {
    if (!str) return { firstName: '', lastName: '' };
    const parts = String(str).trim().split(/\s+/);
    return { firstName: parts[0] || '', lastName: parts.slice(1).join(' ') };
  };

  // הורה - parent (ישן) → parents (חדש)
  if (r.parent && !r.parents) {
    const n = splitName(r.parent.name);
    r.parents = { ...n, phone: r.parent.phone || '', comm: r.parent.comm || '' };
  } else if (r.parents && !r.parents.firstName && r.parents.name) {
    Object.assign(r.parents, splitName(r.parents.name));
  }

  // מובילת צהרון - afternoon.name (ישן) → afternoonLeader (חדש)
  if (r.afternoon && !r.afternoonLeader) {
    r.afternoonLeader = splitName(r.afternoon.name);
  }

  // סייעות - afternoon.assistant (ישן) → assistants[] (חדש)
  if (r.afternoon?.assistant && (!r.assistants || r.assistants.length === 0)) {
    r.assistants = [{ ...splitName(r.afternoon.assistant), type: 'רגילה' }];
  }
  if (!r.assistants) r.assistants = [];

  // צוות בוקר - morning.name (ישן) → morning.firstName/lastName (חדש)
  if (r.morning && !r.morning.firstName && r.morning.name) {
    Object.assign(r.morning, splitName(r.morning.name));
  }

  // יחסי צוותים - relations (חדש) - אם אין, ליצור ריק
  if (!r.relations) r.relations = {};

  return r;
}

async function loadReports() {
  try {
    // לחכות שה-Firebase יטען
    let attempts = 0;
    while (!window._db && attempts < 20) {
      await new Promise(r => setTimeout(r, 100));
      attempts++;
    }
    if (!window._db) throw new Error('Firebase not loaded');

    const q = window._query(window._collection(window._db, 'reports'), window._orderBy('created', 'desc'));
    const snap = await window._getDocs(q);
    allReports = [];
    snap.forEach(doc => allReports.push(normalizeReport({ id: doc.id, ...doc.data() })));
    updateStats();
    render();
  } catch (err) {
    console.error(err);
    document.getElementById('reports-list').innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">שגיאה בטעינה: ${err.message}</div></div>`;
  }
}

function updateStats() {
  const today = new Date().toISOString().split('T')[0];
  const weekAgo = new Date(Date.now() - 7*24*60*60*1000).toISOString();
  document.getElementById('s-total').textContent = allReports.length;
  document.getElementById('s-today').textContent = allReports.filter(r => r.created?.startsWith(today)).length;
  document.getElementById('s-week').textContent = allReports.filter(r => r.created >= weekAgo).length;
  const children = new Set(allReports.map(r => `${r.child?.firstName}_${r.child?.lastName}`));
  document.getElementById('s-children').textContent = children.size;
  renderInsights();
}

function renderInsights() {
  if (allReports.length === 0) return;

  // 1. ילדים בסיכון (3+ דיווחים)
  const childCounts = new Map();
  allReports.forEach(r => {
    const k = `${r.child?.firstName||''} ${r.child?.lastName||''}`.trim();
    if (k) childCounts.set(k, (childCounts.get(k)||0) + 1);
  });
  const atRisk = [...childCounts.entries()].filter(([_, c]) => c >= 3).sort((a,b) => b[1] - a[1]);

  // 2. גנים עם בעיית "בוז" - cluster bad team relationships
  const gansBoz = new Map();
  allReports.forEach(r => {
    if (r.relations?.teamRelationship === 'בוז') {
      const g = r.framework?.kindergarten || 'לא ידוע';
      gansBoz.set(g, (gansBoz.get(g)||0) + 1);
    }
  });
  const topBozGans = [...gansBoz.entries()].sort((a,b) => b[1] - a[1]).slice(0, 3);

  // 3. סוג אירוע מוביל
  const typeCounter = new Map();
  allReports.forEach(r => (r.types||[]).forEach(t => typeCounter.set(t, (typeCounter.get(t)||0) + 1)));
  const topType = [...typeCounter.entries()].sort((a,b) => b[1] - a[1])[0];

  // 4. גן עם הכי הרבה דיווחים
  const ganCounter = new Map();
  allReports.forEach(r => {
    const g = r.framework?.kindergarten;
    if (g) ganCounter.set(g, (ganCounter.get(g)||0) + 1);
  });
  const topGan = [...ganCounter.entries()].sort((a,b) => b[1] - a[1])[0];

  // 5. מנהלת הכי פעילה
  const reporterCounter = new Map();
  allReports.forEach(r => {
    if (r.reporter) reporterCounter.set(r.reporter, (reporterCounter.get(r.reporter)||0) + 1);
  });
  const topReporter = [...reporterCounter.entries()].sort((a,b) => b[1] - a[1])[0];

  // 6. ילדים בהליך תמיכה
  const inSupport = new Set();
  allReports.forEach(r => {
    if (r.relations?.supportProcess && !['אין','לא יודעת'].includes(r.relations.supportProcess)) {
      inSupport.add(`${r.child?.firstName||''} ${r.child?.lastName||''}`.trim());
    }
  });

  const insights = [];

  if (atRisk.length > 0) {
    insights.push(`<div onclick="showChildFile('${atRisk[0][0].replace(/'/g, "\\'")}')" style="background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:14px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:12px">
      <div style="font-size:28px">🚨</div>
      <div style="flex:1">
        <div style="font-weight:700;color:#991b1b;font-size:14px">${atRisk.length} ילדים בתיק לדיון מקצועי</div>
        <div style="font-size:12px;color:#7f1d1d;line-height:1.4">מובילים: ${atRisk.slice(0,3).map(([n,c]) => `${n} (${c})`).join(' · ')}</div>
      </div>
      <div style="color:#991b1b">←</div>
    </div>`);
  }

  if (topBozGans.length > 0) {
    insights.push(`<div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px">
      <div style="font-size:28px">💢</div>
      <div style="flex:1">
        <div style="font-weight:700;color:#9a3412;font-size:14px">בעיה ארגונית - יחסי צוות</div>
        <div style="font-size:12px;color:#7c2d12;line-height:1.4">דיווחים על "בוז" מצוות הבוקר ב: ${topBozGans.map(([g,c]) => `${g} (${c})`).join(' · ')}</div>
      </div>
    </div>`);
  }

  if (inSupport.size > 0) {
    insights.push(`<div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px">
      <div style="font-size:28px">🧠</div>
      <div style="flex:1">
        <div style="font-weight:700;color:#1e40af;font-size:14px">${inSupport.size} ילדים בהליך תמיכה מקצועית</div>
        <div style="font-size:12px;color:#1e3a8a;line-height:1.4">בטיפול פסיכולוג / יועצת חינוכית / מעקב</div>
      </div>
    </div>`);
  }

  if (topType) {
    insights.push(`<div style="background:#fdf2f8;border:1px solid #fbcfe8;border-radius:12px;padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px">
      <div style="font-size:28px">📈</div>
      <div style="flex:1">
        <div style="font-weight:700;color:var(--rose-dark);font-size:14px">סוג אירוע מוביל</div>
        <div style="font-size:12px;color:#831843;line-height:1.4">${topType[0]} - הופיע ב-${topType[1]} דיווחים</div>
      </div>
    </div>`);
  }

  if (topGan) {
    insights.push(`<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px">
      <div style="font-size:28px">🏫</div>
      <div style="flex:1">
        <div style="font-weight:700;color:#166534;font-size:14px">גן עם הכי הרבה דיווחים</div>
        <div style="font-size:12px;color:#14532d;line-height:1.4">${topGan[0]} - ${topGan[1]} דיווחים</div>
      </div>
    </div>`);
  }

  if (topReporter) {
    insights.push(`<div style="background:#fef3c7;border:1px solid #fde68a;border-radius:12px;padding:14px;margin-bottom:0;display:flex;align-items:center;gap:12px">
      <div style="font-size:28px">⭐</div>
      <div style="flex:1">
        <div style="font-weight:700;color:#854d0e;font-size:14px">המדווחת הכי פעילה</div>
        <div style="font-size:12px;color:#713f12;line-height:1.4">${topReporter[0]} - ${topReporter[1]} דיווחים</div>
      </div>
    </div>`);
  }

  if (insights.length > 0) {
    document.getElementById('insights-section').style.display = 'block';
    document.getElementById('insights-content').innerHTML = insights.join('');
  }
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c.dataset.filter === f));
  render();
}
window.setFilter = setFilter;

function render() {
  const search = document.getElementById('search').value.toLowerCase().trim();
  let list = [...allReports];

  if (currentFilter === 'today') {
    const today = new Date().toISOString().split('T')[0];
    list = list.filter(r => r.created?.startsWith(today));
  } else if (currentFilter === 'week') {
    const weekAgo = new Date(Date.now() - 7*24*60*60*1000).toISOString();
    list = list.filter(r => r.created >= weekAgo);
  } else if (currentFilter === 'violence') {
    list = list.filter(r => r.types?.some(t => t.includes('אלימות') || t === 'פציעה' || t === 'בריחה'));
  }

  if (search) {
    list = list.filter(r => {
      const haystack = [
        r.child?.firstName, r.child?.lastName,
        r.parents?.firstName, r.parents?.lastName,
        r.reporter, r.framework?.kindergarten
      ].filter(Boolean).join(' ').toLowerCase();
      return haystack.includes(search);
    });
  }

  const el = document.getElementById('reports-list');
  if (list.length === 0) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">אין דיווחים תואמים</div></div>`;
    return;
  }
  el.innerHTML = list.map((r, i) => {
    const childName = `${r.child?.firstName || ''} ${r.child?.lastName || ''}`.trim();
    const childTotal = allReports.filter(x => `${x.child?.firstName||''} ${x.child?.lastName||''}`.trim() === childName).length;
    const isHighRisk = childTotal >= 3;
    return `<div class="report-card" onclick="showReport(${allReports.indexOf(r)})">
      <div class="report-head">
        <div>
          <div class="report-child">${childName} ${isHighRisk ? '<span style="color:#dc2626;font-size:13px;background:#fee2e2;padding:2px 8px;border-radius:8px;margin-right:6px;cursor:pointer" onclick="event.stopPropagation();showChildFile(\''+childName.replace(/'/g,"\\'")+'\')">🚨 '+childTotal+' אירועים</span>' : childTotal > 1 ? '<span style="color:var(--rose);font-size:12px;cursor:pointer" onclick="event.stopPropagation();showChildFile(\''+childName.replace(/'/g,"\\'")+'\')">📁 '+childTotal+'</span>' : ''}</div>
          <div class="report-date">${new Date(r.created).toLocaleString('he-IL')}</div>
        </div>
      </div>
      <div class="report-meta">
        <span class="meta-pill">📍 ${r.framework?.kindergarten || 'לא צוין'}</span>
        <span class="meta-pill gold">👤 ${r.reporter || 'לא צוין'}</span>
        ${r.relations?.teamRelationship === 'בוז' ? '<span class="meta-pill danger">💢 קשר בוז</span>' : ''}
        ${r.relations?.supportProcess && r.relations.supportProcess !== 'אין' && r.relations.supportProcess !== 'לא יודעת' ? `<span class="meta-pill">🧠 ${r.relations.supportProcess}</span>` : ''}
      </div>
      <div class="report-types">
        ${(r.types || []).map(t => `<span class="type-tag">${t}</span>`).join('')}
      </div>
      ${r.description ? `<div class="report-desc">${r.description.substring(0,150)}${r.description.length>150?'...':''}</div>` : ''}
    </div>`;
  }).join('');
}
window.render = render;

function showReport(idx) {
  const r = allReports[idx];
  if (!r) return;
  const m = document.getElementById('modal-content');
  const assistList = (r.assistants || []).map(a => `${a.firstName} ${a.lastName} (${a.type||'-'})`).join(', ');
  const childName = `${r.child?.firstName || ''} ${r.child?.lastName || ''}`.trim();
  const childReports = allReports.filter(x => `${x.child?.firstName||''} ${x.child?.lastName||''}`.trim() === childName);
  m.innerHTML = `
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2>${r.child?.firstName} ${r.child?.lastName}</h2>
    ${childReports.length > 1 ? `<button onclick="showChildFile('${childName.replace(/'/g, "\\'")}')" style="background:linear-gradient(135deg,var(--rose),var(--rose-dark));color:white;border:none;padding:10px 16px;border-radius:12px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:16px;display:flex;align-items:center;gap:8px">📁 פתח תיק מלא של ${childName} (${childReports.length} אירועים)</button>` : ''}

    <div class="modal-section">
      <div class="modal-section-title">🏢 מסגרת</div>
      <div class="modal-row"><span class="modal-label">מנהלת ממלאת</span><span class="modal-value">${r.reporter || '-'}</span></div>
      <div class="modal-row"><span class="modal-label">גן/בי"ס</span><span class="modal-value">${r.framework?.kindergarten || '-'} (${r.framework?.city||'-'})</span></div>
      <div class="modal-row"><span class="modal-label">תאריך ושעה</span><span class="modal-value">${r.event?.date} · ${r.event?.time}</span></div>
      <div class="modal-row"><span class="modal-label">מיקום</span><span class="modal-value">${r.event?.location || '-'}</span></div>
      <div class="modal-row"><span class="modal-label">אקלים גן</span><span class="modal-value">${r.event?.climate || '-'}</span></div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">👶 הילד וההורים</div>
      <div class="modal-row"><span class="modal-label">ילד</span><span class="modal-value">${r.child?.firstName} ${r.child?.lastName} · ${r.child?.gender||'-'} · ${r.child?.grade||'-'}</span></div>
      <div class="modal-row"><span class="modal-label">הורה</span><span class="modal-value">${r.parents?.firstName || ''} ${r.parents?.lastName || ''}</span></div>
      <div class="modal-row"><span class="modal-label">טלפון</span><span class="modal-value"><a href="tel:${r.parents?.phone||''}">${r.parents?.phone || '-'}</a></span></div>
      <div class="modal-row"><span class="modal-label">תקשורת איתם</span><span class="modal-value">${r.parents?.comm || '-'}</span></div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">🌅 צוות צהרון</div>
      <div class="modal-row"><span class="modal-label">מובילת צהרון</span><span class="modal-value">${r.afternoonLeader?.firstName || ''} ${r.afternoonLeader?.lastName || ''}</span></div>
      <div class="modal-row"><span class="modal-label">סייעות (${r.assistants?.length||0})</span><span class="modal-value">${assistList || '-'}</span></div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">👩‍🏫 צוות בוקר ויחסים</div>
      <div class="modal-row"><span class="modal-label">גננת/מורה</span><span class="modal-value">${r.morning?.firstName || ''} ${r.morning?.lastName || ''}</span></div>
      <div class="modal-row"><span class="modal-label">תקשורת היום</span><span class="modal-value">${r.morning?.comm || '-'}</span></div>
      <div class="modal-row"><span class="modal-label">טיב הקשר בין הצוותים</span><span class="modal-value">${r.relations?.teamRelationship || '-'}</span></div>
      <div class="modal-row"><span class="modal-label">מתי הקושי</span><span class="modal-value">${r.relations?.whenProblem || '-'}</span></div>
      <div class="modal-row"><span class="modal-label">הליך תמיכה</span><span class="modal-value">${r.relations?.supportProcess || '-'}</span></div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">⚠️ האירוע</div>
      <div class="modal-row"><span class="modal-label">סוגים</span><span class="modal-value">${(r.types || []).join(', ') || '-'}</span></div>
      ${r.description ? `<div class="modal-desc">${r.description}</div>` : ''}
    </div>

    <div style="font-size:11px;color:#9ca3af;text-align:center;margin-top:14px;font-family:monospace">ID: ${r.id}</div>
  `;
  document.getElementById('modal-bg').classList.add('show');
}
window.showReport = showReport;

// 📁 תיק ילד מלא - הפיצ'ר הקריטי
function showChildFile(name) {
  const reports = allReports.filter(r => `${r.child?.firstName||''} ${r.child?.lastName||''}`.trim() === name);
  if (reports.length === 0) return;
  const sortedReports = [...reports].sort((a,b) => new Date(b.created) - new Date(a.created));
  const child = reports[0].child;

  const typesCounter = {}, locationsCounter = {}, hoursCounter = {}, climateCounter = {}, gansCounter = {}, reportersCounter = {};
  const morningOnly = reports.filter(r => r.relations?.whenProblem === 'בוקר').length;
  const afternoonOnly = reports.filter(r => r.relations?.whenProblem === 'צהרון').length;
  const both = reports.filter(r => r.relations?.whenProblem === 'גם וגם').length;
  const inSupport = reports.filter(r => r.relations?.supportProcess && !['אין','לא יודעת'].includes(r.relations.supportProcess)).length;
  const bozCount = reports.filter(r => r.relations?.teamRelationship === 'בוז').length;

  reports.forEach(r => {
    (r.types || []).forEach(t => typesCounter[t] = (typesCounter[t]||0) + 1);
    if (r.event?.location) locationsCounter[r.event.location] = (locationsCounter[r.event.location]||0) + 1;
    if (r.event?.time) {
      const h = parseInt(r.event.time.split(':')[0]);
      const slot = h < 11 ? 'בוקר' : h < 14 ? 'צהריים' : h < 17 ? 'צהרון' : 'ערב';
      hoursCounter[slot] = (hoursCounter[slot]||0) + 1;
    }
    if (r.event?.climate) climateCounter[r.event.climate] = (climateCounter[r.event.climate]||0) + 1;
    if (r.framework?.kindergarten) gansCounter[r.framework.kindergarten] = (gansCounter[r.framework.kindergarten]||0) + 1;
    if (r.reporter) reportersCounter[r.reporter] = (reportersCounter[r.reporter]||0) + 1;
  });

  const topItem = obj => {
    const e = Object.entries(obj).sort((a,b) => b[1] - a[1])[0];
    return e ? `${e[0]} (${e[1]})` : '-';
  };

  const isHighRisk = reports.length >= 3;
  const m = document.getElementById('modal-content');

  m.innerHTML = `
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2>📁 ${name}</h2>

    ${isHighRisk ? `<div style="background:linear-gradient(135deg,#fef2f2,#fee2e2);border-right:4px solid #dc2626;padding:14px 16px;border-radius:12px;margin-bottom:16px;display:flex;gap:12px;align-items:center">
      <div style="font-size:32px">🚨</div>
      <div>
        <div style="font-weight:700;color:#991b1b;font-size:15px;margin-bottom:2px">תיק לדיון מקצועי</div>
        <div style="font-size:13px;color:#7f1d1d;line-height:1.4">${reports.length} תיעודים בתיק - מומלץ דיון עם איש מקצוע</div>
      </div>
    </div>` : ''}

    <div class="modal-section">
      <div class="modal-section-title">👶 פרטי הילד/ה</div>
      <div class="modal-row"><span class="modal-label">שם מלא</span><span class="modal-value">${name}</span></div>
      <div class="modal-row"><span class="modal-label">מין · כיתה</span><span class="modal-value">${child?.gender || '-'} · ${child?.grade || '-'}</span></div>
      ${Object.keys(gansCounter).length > 0 ? `<div class="modal-row"><span class="modal-label">גן/בי"ס</span><span class="modal-value">${Object.keys(gansCounter).join(', ')}</span></div>` : ''}
      ${sortedReports[0].parents ? `<div class="modal-row"><span class="modal-label">הורה</span><span class="modal-value">${sortedReports[0].parents.firstName||''} ${sortedReports[0].parents.lastName||''}</span></div>
      <div class="modal-row"><span class="modal-label">טלפון</span><span class="modal-value"><a href="tel:${sortedReports[0].parents.phone||''}">${sortedReports[0].parents.phone || '-'}</a></span></div>` : ''}
    </div>

    <div class="modal-section">
      <div class="modal-section-title">📊 ניתוח דפוסים</div>
      <div class="modal-row"><span class="modal-label">סה"כ אירועים</span><span class="modal-value" style="color:${isHighRisk?'#dc2626':''};font-size:16px">${reports.length}</span></div>
      <div class="modal-row"><span class="modal-label">סוג נפוץ</span><span class="modal-value">${topItem(typesCounter)}</span></div>
      <div class="modal-row"><span class="modal-label">מיקום נפוץ</span><span class="modal-value">${topItem(locationsCounter)}</span></div>
      <div class="modal-row"><span class="modal-label">שעת יום נפוצה</span><span class="modal-value">${topItem(hoursCounter)}</span></div>
      <div class="modal-row"><span class="modal-label">אקלים נפוץ</span><span class="modal-value">${topItem(climateCounter)}</span></div>
      <div class="modal-row"><span class="modal-label">מי מדווחת</span><span class="modal-value">${Object.entries(reportersCounter).map(([n,c]) => `${n} (${c})`).join(', ')}</span></div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">🌅 מתי הקושי?</div>
      ${morningOnly > 0 ? `<div class="modal-row"><span class="modal-label">🌅 רק בבוקר</span><span class="modal-value">${morningOnly}</span></div>` : ''}
      ${afternoonOnly > 0 ? `<div class="modal-row"><span class="modal-label">🌇 רק בצהרון</span><span class="modal-value">${afternoonOnly}</span></div>` : ''}
      ${both > 0 ? `<div class="modal-row"><span class="modal-label">🌗 גם וגם</span><span class="modal-value">${both}</span></div>` : ''}
      ${inSupport > 0 ? `<div class="modal-row"><span class="modal-label">🧠 בהליך תמיכה</span><span class="modal-value" style="color:var(--rose-dark)">צוין ב-${inSupport} דיווחים</span></div>` : ''}
      ${bozCount > 0 ? `<div class="modal-row"><span class="modal-label">💢 קשר "בוז"</span><span class="modal-value" style="color:#991b1b">${bozCount} דיווחים - בעיה ארגונית בגן</span></div>` : ''}
    </div>

    <div class="modal-section">
      <div class="modal-section-title">📋 כל האירועים (${reports.length}) · מהחדש לישן</div>
      ${sortedReports.map((r, idx) => `
        <div style="background:white;border:1px solid rgba(196,112,143,.15);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer" onclick="showReport(${allReports.indexOf(r)})">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px">
            <div style="font-weight:600;font-size:13px;color:var(--ink)">${new Date(r.created).toLocaleDateString('he-IL')} · ${r.event?.time || ''}</div>
            <div style="font-size:11px;color:var(--gray)">${r.reporter || '-'}</div>
          </div>
          <div style="font-size:12px;color:var(--gray);margin-bottom:4px">📍 ${r.event?.location || '-'} · אקלים ${r.event?.climate || '-'} · ${r.framework?.kindergarten || '-'}</div>
          <div style="display:flex;flex-wrap:wrap;gap:4px">
            ${(r.types || []).map(t => `<span style="font-size:10px;background:var(--rose-light);color:var(--rose-dark);padding:2px 8px;border-radius:6px">${t}</span>`).join('')}
          </div>
          ${r.description ? `<div style="font-size:12px;color:var(--ink);margin-top:6px;line-height:1.4">${r.description.substring(0,120)}${r.description.length > 120 ? '...' : ''}</div>` : ''}
        </div>
      `).join('')}
    </div>

    ${reports.length >= 3 ? `<div style="background:var(--cream-deep);padding:14px;border-radius:12px;margin-top:12px;font-size:13px;line-height:1.6;color:var(--ink)">
      💡 <strong>המלצה למשרד:</strong> תיק עם ${reports.length} אירועים מצדיק שיחה עם איש מקצוע. הנתונים יכולים לשמש בסיס לפגישה עם פסיכולוג / יועצת חינוכית.
    </div>` : ''}
  `;
  if (!document.getElementById('modal-bg').classList.contains('show')) {
    document.getElementById('modal-bg').classList.add('show');
  }
}
window.showChildFile = showChildFile;

function closeModal() { document.getElementById('modal-bg').classList.remove('show'); }
window.closeModal = closeModal;

// Auto-load if already authenticated
if (localStorage.getItem('office_key') === ACCESS_KEY) {
  setTimeout(loadReports, 200);
}
</script>

</body>
</html>
